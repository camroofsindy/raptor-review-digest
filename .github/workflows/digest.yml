name: Weekly Digest

on:
  schedule:
    # Tuesday and Thursday at 7:30am Eastern (11:30 UTC during EDT, 12:30 UTC during EST).
    # Single cron at 11:30 UTC: fires at 7:30am EDT (Mar-Nov), 6:30am EST (Nov-Mar).
    # Dual cron handles both windows so the inbox-arrival time stays at 7:30am year round.
    - cron: "30 11 * * 2,4"  # EDT window (Mar-Nov): 7:30am Eastern
    - cron: "30 12 * * 2,4"  # EST window (Nov-Mar): 7:30am Eastern
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: "https://camroofsindy.github.io/raptor-review-digest/"
        run: python main.py

      - name: Commit updated history and dashboard
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh digest $(date -u +%Y-%m-%d) [skip ci]"
            # Handle the race where another push landed during the run.
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected, attempt $i — pulling and retrying"
              git pull --rebase --strategy-option=theirs origin main || true
              sleep 3
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
