name: Weekly Digest

on:
  schedule:
    # Daily run, target inbox by 8:00am Eastern.
    # GitHub Actions cron is best-effort and routinely runs 1-6 hours late at peak times,
    # so we fire EARLY (4:00am ET) and add a backup at 5:00am ET. The job itself dedupes
    # by checking whether today's run already committed history; if so it exits 0.
    - cron: "0 8 * * *"   # 4:00am EDT (Mar-Nov) / 3:00am EST (Nov-Mar), primary
    - cron: "0 9 * * *"   # 5:00am EDT (Mar-Nov) / 4:00am EST (Nov-Mar), primary EST window
    - cron: "0 10 * * *"  # 6:00am EDT, backup if first two were skipped/delayed
    - cron: "0 11 * * *"  # 7:00am EDT, last-chance backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Skip if already ran today (scheduled only)
        id: dedupe
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual trigger; not deduping"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          # The auto-commit message is "Refresh digest YYYY-MM-DD [skip ci]"; search for today's.
          if git log --since="${today} 00:00 UTC" --until="${today} 23:59 UTC" --grep="Refresh digest ${today}" --oneline | grep -q .; then
            echo "already ran today; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no run yet today; proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run digest
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: "https://camroofsindy.github.io/raptor-review-digest/"
        run: python main.py

      - name: Commit updated history and dashboard
        if: steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Refresh digest $(date -u +%Y-%m-%d) [skip ci]"
          # Race-safe push: if rejected, fetch remote, soft-reset to it (keeps our
          # fresh files staged), re-commit on top, retry. Up to 3 attempts.
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i — re-syncing onto latest remote"
            git fetch origin main
            git reset --soft origin/main
            git add data/history.json docs/
            if git diff --staged --quiet; then
              echo "nothing to push after re-sync"
              exit 0
            fi
            git commit -m "Refresh digest $(date -u +%Y-%m-%d) [skip ci]"
            sleep 2
          done
          echo "push still failing after retries — deploy artifact will still upload"

      - name: Upload Pages artifact
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
